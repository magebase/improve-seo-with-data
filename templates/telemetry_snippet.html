<!-- 4. Core Web Vitals RUM Telemetry (Deferred until idle/first-input) -->
<script>
  (function() {
    var loaded = false;
    function loadWebVitals() {
      if (loaded) return;
      loaded = true;
      import('https://unpkg.com/web-vitals@4.2.4/dist/web-vitals.attribution.js?module')
        .then(function(mod) {
          function sendToTelemetry(metric) {
            if (window.gtag) {
              window.gtag('event', metric.name, {
                value: Math.round(metric.name === 'CLS' ? metric.value * 1000 : metric.value),
                event_category: 'Web Vitals',
                event_label: metric.id,
                non_interaction: true
              });
            }
            if (window.posthog && window.posthog.capture) {
              window.posthog.capture('web_vital_metric', {
                metric_name: metric.name,
                metric_value: metric.value,
                metric_rating: metric.rating
              });
            }
          }
          mod.onCLS(sendToTelemetry);
          mod.onINP(sendToTelemetry);
          mod.onLCP(sendToTelemetry);
        })
        .catch(function() {});
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadWebVitals, { timeout: 3500 });
    } else {
      window.addEventListener('pointerdown', loadWebVitals, { once: true, passive: true });
      window.addEventListener('keydown', loadWebVitals, { once: true, passive: true });
    }
  })();
</script>
